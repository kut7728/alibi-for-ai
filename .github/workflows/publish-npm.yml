name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm version
        run: |
          npm_version=$(npm --version)
          echo "Using npm $npm_version"
          if [[ ! $npm_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             ! printf '%s\n' 11.5.1 "$npm_version" | sort -V -C; then
            echo "Trusted publishing requires npm 11.5.1 or later."
            exit 1
          fi
      - name: Verify release tag
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [[ "${GITHUB_REF_NAME#v}" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
