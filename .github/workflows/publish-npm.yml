name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [[ "${GITHUB_REF_NAME#v}" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Pack npm package
        run: |
          pack_dir=$(mktemp -d "$RUNNER_TEMP/npm-pack.XXXXXX")
          npm pack --pack-destination "$pack_dir"
          mv "$pack_dir"/*.tgz "$RUNNER_TEMP/alibai.tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/alibai.tgz
          if-no-files-found: error

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm version
        run: |
          npm_version=$(npm --version)
          echo "Using npm $npm_version"
          if [[ ! $npm_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             ! printf '%s\n' 11.5.1 "$npm_version" | sort -V -C; then
            echo "Trusted publishing requires npm 11.5.1 or later."
            exit 1
          fi
      - name: Publish npm tarball
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$RELEASE_PRERELEASE" in
            true) set -- --tag next ;;
            false) set -- ;;
            *)
              echo "Expected the GitHub release prerelease flag to be true or false."
              exit 1
              ;;
          esac
          npm publish "$RUNNER_TEMP/npm-package/alibai.tgz" --provenance --access public "$@"
